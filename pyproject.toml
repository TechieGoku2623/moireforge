[project]
name = "moireforge"
version = "0.1.0"
description = "Moiré superlattice SoC — physics, RTL, API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "matplotlib>=3.9.0",
    "scipy>=1.14.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["sim", "solutions", "saas", "scripts", "tests"]
